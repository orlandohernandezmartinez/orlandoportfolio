<!DOCTYPE html>
<html lang="en" data-theme="light" data-preloader-word="PROJECTS">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects — Orlando Hernández Martínez</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4XK1FM34B3"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-4XK1FM34B3');</script>
  <script>(function(){ const t=localStorage.getItem('theme'); if(t) document.documentElement.setAttribute('data-theme',t); })();</script>
  <link rel="preload" href="preloader.js" as="script" />
  <style>
    :root{--bg:#ffffff;--fg:#111111;--fg-muted:#555555;--fg-dim:#999999;--lang-muted:#999999;--tr:0.35s cubic-bezier(0.4,0,0.2,1);}
    [data-theme="dark"]{--bg:#0d0d0d;--fg:#f0f0f0;--fg-muted:#aaaaaa;--fg-dim:#444444;--lang-muted:#555555;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{font-size:16px;scroll-behavior:smooth;}
    body{font-family:'Gotham','Futura','Century Gothic','Trebuchet MS',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden;transition:background 0.25s ease,color 0.25s ease;}
    #preloader{position:fixed;inset:0;background:var(--bg);z-index:2000;display:none;align-items:center;justify-content:center;transition:opacity 350ms ease;}
    #preloader.fade-out{opacity:0;pointer-events:none;}
    #matrix{display:grid;width:100vw;height:100vh;position:absolute;inset:0;}
    .cell{display:flex;align-items:center;justify-content:center;font-family:'Gotham','Futura','Century Gothic',monospace;font-weight:700;letter-spacing:0.05em;color:transparent;text-transform:uppercase;user-select:none;transition:color 0.06s ease;}
    .cell.on{color:var(--fg);}
    #transition-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1000;display:none;}
    .topbar{position:fixed;top:0;right:0;padding:24px 32px;display:flex;align-items:center;gap:14px;z-index:100;}
    .lang-switcher{display:flex;align-items:center;gap:6px;font-size:0.78rem;letter-spacing:0.1em;}
    .lang-switcher a{text-decoration:none;color:var(--lang-muted);font-weight:400;cursor:pointer;transition:color var(--tr);}
    .lang-switcher a:hover,.lang-switcher a.active{color:var(--fg);font-weight:700;}
    .lang-divider{color:var(--lang-muted);user-select:none;}
    .topbar-btn{background:none;border:none;cursor:pointer;font-size:1.25rem;line-height:1;padding:2px;display:flex;align-items:center;transition:transform 0.3s ease;text-decoration:none;}
    .topbar-btn:hover{transform:scale(1.2) rotate(15deg);}
    .icon-to-dark{display:inline;}.icon-to-light{display:none;}
    [data-theme="dark"] .icon-to-dark{display:none;}[data-theme="dark"] .icon-to-light{display:inline;}
    main{max-width:900px;padding:clamp(80px,12vh,140px) clamp(32px,8vw,120px) 80px;}
    .project-list{display:flex;flex-direction:column;}
    .project-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;padding:clamp(20px,3.5vh,32px) 0;opacity:0;transform:translateY(20px);animation:fadeUp 0.6s forwards;}
    .project-row:nth-child(1){animation-delay:0.04s;}.project-row:nth-child(2){animation-delay:0.11s;}
    .project-row:nth-child(3){animation-delay:0.18s;}.project-row:nth-child(4){animation-delay:0.25s;}
    .project-row:nth-child(5){animation-delay:0.32s;}.project-row:nth-child(6){animation-delay:0.39s;}
    .content.fade-in .project-row{animation:fadeUp 0.35s forwards;}
    .content.fade-in .project-row:nth-child(1){animation-delay:0s;}.content.fade-in .project-row:nth-child(2){animation-delay:0.05s;}
    .content.fade-in .project-row:nth-child(3){animation-delay:0.10s;}.content.fade-in .project-row:nth-child(4){animation-delay:0.15s;}
    .content.fade-in .project-row:nth-child(5){animation-delay:0.20s;}.content.fade-in .project-row:nth-child(6){animation-delay:0.25s;}
    .project-name{font-size:clamp(0.95rem,1.5vw,1.1rem);font-weight:700;color:var(--fg);text-decoration:none;position:relative;display:inline;line-height:1.6;}
    .project-name::after{content:'';position:absolute;bottom:-2px;left:0;right:100%;height:1.5px;background:var(--fg);transition:right 0.28s ease;}
    .project-name:hover::after{right:0;}
    .project-category{font-size:clamp(0.82rem,1.2vw,0.95rem);font-weight:400;color:var(--fg);line-height:1.5;}
    .project-year{font-size:clamp(0.78rem,1.1vw,0.88rem);font-weight:300;color:var(--fg-muted);margin-top:3px;}
    @media(max-width:520px){.project-row{grid-template-columns:1fr;gap:6px;}}
    @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
    @media(max-width:600px){.topbar{padding:18px 20px;}}
  </style>
</head>
<body>
  <div id="preloader"><div id="matrix"></div></div>
  <canvas id="transition-canvas"></canvas>
  <div class="topbar">
    <nav class="lang-switcher" aria-label="Language">
      <a href="#" onclick="setLang('es');return false;">es</a>
      <span class="lang-divider">|</span>
      <a href="#" onclick="setLang('en');return false;" class="active">en</a>
    </nav>
    <button class="topbar-btn" onclick="toggleTheme()" aria-label="Toggle theme">
      <span class="icon-to-dark">🌚</span><span class="icon-to-light">🌝</span>
    </button>
    <a href="index.html" data-preload data-word="HOME" class="topbar-btn" aria-label="Home">🏠</a>
  </div>
  <main>
    <div class="content" id="content">
      <div class="project-list">
        <div class="project-row">
          <a class="project-name" href="https://www.sohmhos.art/" target="_blank" rel="noopener">Sohmhos x metanolA</a>
          <div class="project-meta"><p class="project-category">Monterrey, México</p><p class="project-year">2026</p></div>
        </div>
        <div class="project-row">
          <a class="project-name" href="https://orlandohm.myportfolio.com/design-week-2025" target="_blank" rel="noopener">Tejido Urbano</a>
          <div class="project-meta"><p class="project-category">Design Week México</p><p class="project-year">2025</p></div>
        </div>
        <div class="project-row">
          <a class="project-name" href="https://www.cartesiano360.com/en/home?gad_campaignid=21671763496&gbraid=0AAAAABjLxRaTyFhrWxPhHxjQDaiSer2dV" target="_blank" rel="noopener">Cartesiano Boutique &amp; Wellness Hotel</a>
          <div class="project-meta"><p class="project-category">Web Design &amp; Development</p><p class="project-year">2025</p></div>
        </div>
        <div class="project-row">
          <a class="project-name" href="https://www.promuevo.mx/" target="_blank" rel="noopener">Promuevo</a>
          <div class="project-meta"><p class="project-category">Web Design &amp; Development</p><p class="project-year">2024</p></div>
        </div>
        <div class="project-row">
          <a class="project-name" href="https://orlandohm.myportfolio.com/web3-logo-design" target="_blank" rel="noopener">ReadyMade</a>
          <div class="project-meta"><p class="project-category">Branding</p><p class="project-year">2023</p></div>
        </div>
        <div class="project-row">
          <a class="project-name" href="https://orlandohm.myportfolio.com/mezcal-branding" target="_blank" rel="noopener">Mezcal Esmeralda</a>
          <div class="project-meta"><p class="project-category">Branding</p><p class="project-year">2023</p></div>
        </div>
      </div>
    </div>
  </main>
  <script src="preloader.js"></script>
  <script>
    function setLang(lang){ if(lang!=='en') window.location.href='es/projects.html'; }
    window._refadeContent=function(){
      const c=document.getElementById('content');if(!c)return;
      c.classList.remove('fade-in');
      c.querySelectorAll('.project-row').forEach(el=>{el.style.opacity='0';el.style.transform='translateY(16px)';});
      void c.offsetHeight;c.classList.add('fade-in');
      setTimeout(()=>{c.querySelectorAll('.project-row').forEach(el=>{el.style.opacity='';el.style.transform='';});c.classList.remove('fade-in');},600);
    };
  </script>
</body>
</html>
