<!DOCTYPE html>
<html lang="en" data-theme="light" data-preloader-word="HOME">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orlando Hernández Martínez</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-4XK1FM34B3"></script>
  <script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-4XK1FM34B3');</script>

  <!-- Apply saved theme before paint — no flash -->
  <script>
    (function(){ const t=localStorage.getItem('theme'); if(t) document.documentElement.setAttribute('data-theme',t); })();
  </script>

  <!-- Preload shared script for instant cache hit on next page -->
  <link rel="preload" href="preloader.js" as="script" />

  <style>
    :root { --bg:#ffffff; --fg:#111111; --fg-muted:#555555; --fg-dim:#999999; --lang-muted:#999999; --tr:0.35s cubic-bezier(0.4,0,0.2,1); }
    [data-theme="dark"] { --bg:#0d0d0d; --fg:#f0f0f0; --fg-muted:#aaaaaa; --fg-dim:#444444; --lang-muted:#555555; }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html{font-size:16px;}
    body{font-family:'Gotham','Futura','Century Gothic','Trebuchet MS',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden;transition:background 0.25s ease,color 0.25s ease;}

    /* Preloader hidden by default — JS shows it only when needed */
    #preloader{position:fixed;inset:0;background:var(--bg);z-index:2000;display:none;align-items:center;justify-content:center;transition:opacity 350ms ease;}
    #preloader.fade-out{opacity:0;pointer-events:none;}
    #matrix{display:grid;width:100vw;height:100vh;position:absolute;inset:0;}
    .cell{display:flex;align-items:center;justify-content:center;font-family:'Gotham','Futura','Century Gothic',monospace;font-weight:700;letter-spacing:0.05em;color:transparent;text-transform:uppercase;user-select:none;transition:color 0.06s ease;}
    .cell.on{color:var(--fg);}
    #transition-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1000;display:none;}

    /* Topbar */
    .topbar{position:fixed;top:0;right:0;padding:24px 32px;display:flex;align-items:center;gap:14px;z-index:100;}
    .lang-switcher{display:flex;align-items:center;gap:6px;font-size:0.78rem;letter-spacing:0.1em;}
    .lang-switcher a{text-decoration:none;color:var(--lang-muted);font-weight:400;cursor:pointer;transition:color var(--tr);}
    .lang-switcher a:hover,.lang-switcher a.active{color:var(--fg);font-weight:700;}
    .lang-divider{color:var(--lang-muted);user-select:none;}
    .topbar-btn{background:none;border:none;cursor:pointer;font-size:1.25rem;line-height:1;padding:2px;display:flex;align-items:center;transition:transform 0.3s ease;text-decoration:none;}
    .topbar-btn:hover{transform:scale(1.2) rotate(15deg);}
    .icon-to-dark{display:inline;}.icon-to-light{display:none;}
    [data-theme="dark"] .icon-to-dark{display:none;}[data-theme="dark"] .icon-to-light{display:inline;}

    /* Main */
    main{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;text-align:left;padding:clamp(80px,12vh,140px) clamp(32px,8vw,120px) 60px;max-width:900px;}
    .content{width:100%;}

    .hero-name{font-size:clamp(1.5rem,3.5vw,2.6rem);font-weight:700;line-height:1.2;color:var(--fg);opacity:0;transform:translateY(20px);animation:fadeUp 0.7s 0.05s forwards;}
    .hero-subtitle{margin-top:14px;font-size:clamp(0.88rem,1.4vw,1.05rem);font-weight:300;color:var(--fg-muted);line-height:1.7;max-width:540px;opacity:0;transform:translateY(18px);animation:fadeUp 0.7s 0.15s forwards;transition:color var(--tr);}
    .nav{margin-top:clamp(48px,9vh,88px);display:flex;flex-direction:column;align-items:flex-start;gap:clamp(14px,3vh,28px);}
    .nav a{font-size:clamp(0.95rem,1.6vw,1.2rem);font-weight:600;letter-spacing:0.03em;text-decoration:none;color:var(--fg);position:relative;opacity:0;transform:translateY(14px);transition:color var(--tr);}
    .nav a:nth-child(1){animation:fadeUp 0.6s 0.28s forwards;}
    .nav a:nth-child(2){animation:fadeUp 0.6s 0.36s forwards;}
    .nav a:nth-child(3){animation:fadeUp 0.6s 0.44s forwards;}
    .nav a::after{content:'';position:absolute;bottom:-3px;left:0;right:100%;height:1.5px;background:var(--fg);transition:right 0.28s ease;}
    .nav a:hover::after{right:0;}

    /* Re-fade after theme switch */
    .content.fade-in .hero-name{animation:fadeUp 0.4s 0s forwards;}
    .content.fade-in .hero-subtitle{animation:fadeUp 0.4s 0.06s forwards;}
    .content.fade-in .nav a:nth-child(1){animation:fadeUp 0.35s 0.12s forwards;}
    .content.fade-in .nav a:nth-child(2){animation:fadeUp 0.35s 0.17s forwards;}
    .content.fade-in .nav a:nth-child(3){animation:fadeUp 0.35s 0.22s forwards;}

    @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}
    @media(max-width:600px){.topbar{padding:18px 20px;}}
  </style>
</head>
<body>

  <div id="preloader"><div id="matrix"></div></div>
  <canvas id="transition-canvas"></canvas>

  <div class="topbar">
    <nav class="lang-switcher" aria-label="Language">
      <a href="#" onclick="setLang('es');return false;">es</a>
      <span class="lang-divider">|</span>
      <a href="#" onclick="setLang('en');return false;" class="active">en</a>
    </nav>
    <button class="topbar-btn" onclick="toggleTheme()" aria-label="Toggle theme">
      <span class="icon-to-dark">🌚</span><span class="icon-to-light">🌝</span>
    </button>
  </div>

  <main>
    <div class="content" id="content">
      <h1 class="hero-name">Hi, I'm Orlando Hernández Martínez</h1>
      <p class="hero-subtitle">Designer of interfaces at the intersection of UX, data, and generative systems.</p>
      <nav class="nav" aria-label="Main navigation">
        <a href="projects.html" data-preload data-word="PROJECTS">Projects</a>
        <a href="about.html"    data-preload data-word="ABOUT">About</a>
        <a href="contact.html"  data-preload data-word="CONTACT">Contact</a>
      </nav>
    </div>
  </main>

  <script src="preloader.js"></script>
  <script>
    function setLang(lang){ if(lang!=='en') window.location.href='es/index.html'; }

    window._refadeContent = function(){
      const c=document.getElementById('content'); if(!c)return;
      c.classList.remove('fade-in');
      c.querySelectorAll('.hero-name,.hero-subtitle,.nav a').forEach(el=>{el.style.opacity='0';el.style.transform='translateY(14px)';});
      void c.offsetHeight; c.classList.add('fade-in');
      setTimeout(()=>{c.querySelectorAll('.hero-name,.hero-subtitle,.nav a').forEach(el=>{el.style.opacity='';el.style.transform='';});c.classList.remove('fade-in');},600);
    };
  </script>

</body>
</html>
